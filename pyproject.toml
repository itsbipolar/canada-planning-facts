[project]
name = "canada-planning-facts"
version = "0.0.1"
description = "Hand-verified Canadian planning facts as a local MCP server and Agent Skill. Prototype; education, not advice."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.9,<3", "pyyaml>=6.0,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canada_planning_facts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
