  - id: rrif_minimum_factors
    series: rrif_minimum_factors
    title: RRIF minimum withdrawal factors by age (Income Tax Regulations 7308(4))
    kind: fixed
    jurisdiction: federal
    unit: factor
    value:
      - {age: 71, factor: "0.0528"}
      - {age: 72, factor: "0.0540"}
      - {age: 73, factor: "0.0553"}
      - {age: 74, factor: "0.0567"}
      - {age: 75, factor: "0.0582"}
