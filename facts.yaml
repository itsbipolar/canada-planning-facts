  - id: cda_life_insurance_proceeds
    series: cda_life_insurance_proceeds
    title: Life insurance proceeds a corporation receives on a death are added to its capital dividend account (Income Tax Act 89(1), capital dividend account, paragraph (d))
    kind: fixed
    jurisdiction: federal
    unit: text
    value: "Added to the capital dividend account: the proceeds of a life insurance policy received by the corporation in consequence of the death of any person, less the policy's adjusted cost basis immediately before the death (see cda_life_insurance_acb_deduction)"
    source_url: https://laws-lois.justice.gc.ca/eng/acts/I-3.3/section-89.html
    source_quote: "(ii) all amounts each of which is the proceeds of a life insurance policy (other than an LIA policy) of which the corporation was not a beneficiary on or before June 28, 1982 received by the corporation in the period and after May 23, 1985 in consequence of the death of any person"
    authority: statute
    as_of: 2026-11-17
    status: confirmed
    verified_by: "Claude, on Mo's standing OK of 2026-11-12"
    verified_on: 2026-11-17
    notes: "Paragraph (d) of the definition 'capital dividend account' in 89(1) opens 'the amount, if any, by which the total of' (i), proceeds where the corporation was a beneficiary on or before June 28, 1982, and (ii), quoted, 'exceeds the total of all amounts each of which is' (iii) the adjusted cost basis and (iv) to (vi), which deal with 10/8 policies and some transfers of policies before March 22, 2016. 'The period' starts with the corporation's first taxation year that began after it last became a private corporation. The account is the total of paragraphs (a) to (h) less other amounts, so this is one part of it. Act current to 2026-10-29 (last amended 2026-06-18). Used by the corporate-owned life insurance tool. Mo to review before the site is advertised."
  - id: cda_life_insurance_acb_deduction
    series: cda_life_insurance_acb_deduction
    title: The policy's adjusted cost basis immediately before the death is taken off the proceeds added to the capital dividend account (Income Tax Act 89(1), capital dividend account, subparagraph (d)(iii))
    kind: fixed
    jurisdiction: federal
    unit: text
    value: "Subtracted from the life insurance proceeds added to the capital dividend account: the adjusted cost basis (as defined in 148(9)), immediately before the death, of the policyholder's interest in the policy (deaths after March 21, 2016)"
    source_url: https://laws-lois.justice.gc.ca/eng/acts/I-3.3/section-89.html
    source_quote: "(iii) the adjusted cost basis (in this paragraph as defined in subsection 148(9)), immediately before the death, of"
    authority: statute
    as_of: 2026-11-17
    status: confirmed
    verified_by: "Claude, on Mo's standing OK of 2026-11-12"
    verified_on: 2026-11-17
    notes: "The quoted line continues with '(A) if the death occurs before March 22, 2016, a policy referred to in subparagraph (i) or (ii) to the corporation, and' and '(B) if the death occurs after March 21, 2016, a policyholder’s interest in a policy referred to in subparagraph (i) or (ii),'. The part of the proceeds equal to this basis does not go into the account. Act current to 2026-10-29 (last amended 2026-06-18). Mo to review before the site is advertised."
  - id: capital_dividend_election
    series: capital_dividend_election
    title: A dividend a private corporation elects to be a capital dividend is not included in the shareholder's income (Income Tax Act 83(2))
    kind: fixed
    jurisdiction: federal
    unit: text
    value: "When a private corporation elects for the full amount of a dividend (in prescribed manner and form, on time), the dividend is a capital dividend to the extent of its capital dividend account immediately before it became payable, and no part of it is included in computing the income of any shareholder"
    source_url: https://laws-lois.justice.gc.ca/eng/acts/I-3.3/section-83.html
    source_quote: "(b) no part of the dividend shall be included in computing the income of any shareholder of the corporation."
    authority: statute
    as_of: 2026-11-17
    status: confirmed
    verified_by: "Claude, on Mo's standing OK of 2026-11-12"
    verified_on: 2026-11-17
    notes: "83(2) opens 'Where at any particular time after 1971 a dividend becomes payable by a private corporation to shareholders of any class of shares of its capital stock and the corporation so elects in respect of the full amount of the dividend, in prescribed manner and prescribed form and at or before the particular time or the first day on which any part of the dividend was paid if that day is earlier than the particular time, the following rules apply:' and rule (a) reads '(a) the dividend shall be deemed to be a capital dividend to the extent of the corporation’s capital dividend account immediately before the particular time; and'. 83(2.1) to (2.4) are anti-avoidance rules; 83(2.3) says 83(2.1) does not apply where the purpose of the dividend was to distribute life insurance proceeds included in the account under paragraph (d). The CRA form is 'T2054 Election for a Capital Dividend Under Subsection 83(2)' (canada.ca forms page, page details 2025-03-24; read through a page reader, as canada.ca refuses a direct download here). Act current to 2026-10-29. Mo to review before the site is advertised."
