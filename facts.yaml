  - id: life_insurance_policy_acb_definition
    series: life_insurance_policy_acb_definition
    title: Adjusted cost basis of a policyholder's interest in a life insurance policy (Income Tax Act 148(9))
    kind: fixed
    jurisdiction: federal
    unit: text
    value: "A formula: amounts that raise the basis (A to G.1, among them the cost of an interest acquired and premiums paid by or on behalf of the policyholder) less amounts that lower it (H to O, among them proceeds of disposition and, for policies last acquired after December 1, 1982, the net cost of pure insurance determined by the issuer)"
    source_url: https://laws-lois.justice.gc.ca/eng/acts/I-3.3/section-148.html
    source_quote: "adjusted cost basis, at any time to a policyholder of the policyholder’s interest in a life insurance policy, means the amount determined by the formula"
    authority: statute
    as_of: 2026-11-17
    status: confirmed
    verified_by: "Claude, on Mo's standing OK of 2026-11-12"
    verified_on: 2026-11-17
    notes: "The formula is '(A + B + C + D + E + F + G + G.1) – (H + I + J + K + L + M + N + O)'. B 'is the total of all amounts each of which is an amount paid before that time by or on behalf of the policyholder in respect of a premium under the policy, other than amounts referred to in' certain provisions; L(a) is 'in the case of an interest in a life insurance policy (other than an annuity contract) that was last acquired after December 1, 1982 by the policyholder, the total of all amounts each of which is the net cost of pure insurance, as defined by regulation and determined by the issuer of the policy in accordance with the regulations'. The net cost of pure insurance tables are in the Regulations and are not in this file. A text rule only; no figure. Act current to 2026-10-29. Mo to review before the site is advertised."
  - id: ontario_surtax_base
    series: ontario_surtax_base
    title: What the Ontario surtax is figured on, the gross tax amount, and where the Ontario dividend tax credit comes in (Taxation Act, 2007 (Ontario) 16(2))
    kind: fixed
    jurisdiction: "ON"
    unit: text
    value: "The surtax is figured on the gross tax amount: basic Ontario tax less the non-refundable credits in subdivision b, plus additional taxes (sections 11 and 12), less the credits in subdivision d. The Ontario dividend tax credit (section 19.1, subdivision g) is not among them, so it comes off after the surtax"
    source_url: https://www.ontario.ca/laws/statute/07t11
    source_quote: "1. Determine the amount, if any, by which the individual’s basic personal income tax for the year, as determined under subdivision a, exceeds the sum of all non-refundable tax credits under subdivision b that are deducted by the individual for the year."
    authority: statute
    as_of: 2026-11-17
    status: confirmed
    verified_by: "Claude, on Mo's standing OK of 2026-11-12"
    verified_on: 2026-11-17
    notes: "16(2) goes on: '2. Determine the amount of the individual’s additional tax, if any, payable for the year under sections 11 and 12.', '3. Add the amounts determined under paragraphs 1 and 2.' and '4. The gross tax amount of the individual for the year is the amount, if any, by which the total amount determined under paragraph 3 exceeds the sum of all tax credits under subdivision d that are deducted by the individual for the year.' The Act's table of contents lists 'Subdivision d — Additional Tax Credits before Surtax' (sections 13 to 15) and 'Subdivision g — Ontario Dividend Tax Credit, 2016 and subsequent taxation years' (section 19.1). The surtax thresholds and rates are in ontario_surtax.<year> (T4127). Needed to compute a dividend's Ontario tax at the top bracket correctly. Mo to review before the site is advertised."
