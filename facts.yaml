  - id: ontario_surtax.2026
    series: ontario_surtax
    title: Ontario surtax on basic Ontario tax (each row's rate applies to basic Ontario tax above its 'from' amount; the rows add together)
    kind: yearly
    jurisdiction: "ON"
    tax_year: 2026
    unit: percent
    value:
      - {from: "5818", rate: "20"}
      - {from: "7446", rate: "36"}
    source_url: https://www.canada.ca/en/revenue-agency/services/forms-publications/payroll/t4127-payroll-deductions-formulas/t4127-jan/t4127-jan-payroll-deductions-formulas-computer-programs.html
    source_quote: "V1 = (0.20 × (T4 – $5,818)) + (0.36 × (T4 – $7,446))"
    authority: official_publication
    as_of: 2026-11-15
    status: confirmed
    verified_by: "Claude, on Mo's standing OK of 2026-11-12"
    verified_on: 2026-11-15
    notes: "T4127 Payroll Deductions Formulas, 122nd edition, effective January 1, 2026, Step 5 (Ontario). V1 is the Ontario surtax and T4 the basic Ontario tax; the lines before read 'Where T4 ≤ $5,818 V1 = $0' and 'Where $5,818 < T4 ≤ $7,446 V1 = 0.20 × (T4 – $5,818)'. Table 8.2's ON row also gives 5,818 / 0.20 and 7,446 / 0.36. Not marginal brackets: above $7,446 both rows apply. Read through a page reader (canada.ca refuses direct download here); whitespace in the formula collapsed. Mo to review before the site is advertised."
